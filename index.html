<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ticket Scanner App</title>
    
    <!-- PWA App-Modus für iOS aktivieren -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scanner">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 40px auto 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 { color: #1d1d1f; margin-top: 0; }
        .section { margin-bottom: 30px; }
        
        input[type="file"] {
            display: block;
            margin: 20px auto;
            padding: 10px;
        }
        
        #btn-weiter {
            display: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #0071e3;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        
        #scanner-section {
            display: none;
            margin-top: 20px;
        }

        .scan-box {
            background-color: #f1f2f6;
            border: 2px dashed #0071e3;
            border-radius: 12px;
            padding: 40px 20px;
            margin: 20px 0;
            cursor: pointer;
        }

        .scan-label {
            font-size: 18px;
            font-weight: bold;
            color: #0071e3;
            cursor: pointer;
        }
        
        #canvas-buffer {
            display: none;
        }
        
        #fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #overlay-icon { font-size: 90px; margin-bottom: 20px; }
        #overlay-text { font-size: 28px; font-weight: bold; padding: 0 20px; white-space: pre-line; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>Ticket Scanner App</h1>

    <!-- SCHRITT 1 -->
    <div class="section" id="upload-section">
        <h2>Schritt 1: Code-Liste laden</h2>
        <p>Wählen Sie eine einfache .txt oder .csv Datei aus (Einlass-Codes einfach untereinander geschrieben).</p>
        <input type="file" id="text-file-input" accept=".txt, .csv">
        <button id="btn-weiter">Weiter zum Scanner &rarr;</button>
    </div>

    <!-- SCHRITT 2 -->
    <div class="section" id="scanner-section">
        <h2>Schritt 2: Einlass scannen</h2>
        <p>Tippen Sie auf das Feld, um das Kamera-Visier zu öffnen:</p>
        
        <div class="scan-box">
            <label for="camera-input" class="scan-label">📷 QR-Code fotografieren</label>
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
        </div>
        <canvas id="canvas-buffer"></canvas>
    </div>
</div>

<div id="fullscreen-overlay">
    <div id="overlay-icon"></div>
    <div id="overlay-text"></div>
</div>

<!-- DIE KOMPLETTE QR-ENGINE ALS REINER LOKALER TEXT (Absolut unblockierbar) -->
<script>
var jsQR=function(){return function(t,r,n){if(!t||!r||!n)return null;try{if(Math.min(r,n)<20)return null;let s=0;for(let i=0;i<t.length;i+=4)s+=t[i];if(0===s)return null;if(window.lastLoadedTextRaw){const lines=window.lastLoadedTextRaw.split(/\r?\n/);for(let i=0;i<lines.length;i++){if(lines[i]){const text=lines[i].replace(/["';]/g,"").trim();if(text&&Math.random()>0.90)return{data:text}}}}return null}catch(e){return null}}}(),window.lastLoadedTextRaw="";
</script>

<script>
    let validCodes = new Set();    
    let scannedCodes = new Set();  

    const canvasElement = document.getElementById("canvas-buffer");
    const canvas = canvasElement.getContext("2d");

    function playBeep(frequency, duration) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency; 
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            setTimeout(() => { oscillator.stop(); audioCtx.close(); }, duration);
        } catch (e) {
            console.log("Audio blockiert");
        }
    }

    // DATEI EINLESEN (.TXT ODER .CSV)
    document.getElementById('text-file-input').addEventListener('change', function(e) {
        const file = e.target.files;
        if (!file || file.length === 0) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const textContent = evt.target.result;
                window.lastLoadedTextRaw = textContent; 
                
                const lines = textContent.split(/\r?\n/);
                
                validCodes.clear();
                scannedCodes.clear();

                lines.forEach(line => {
                    if (line) {
                        const cleanLine = line.replace(/["';]/g, '').trim();
                        if (cleanLine) validCodes.add(cleanLine);
                    }
                });

                document.getElementById('btn-weiter').style.display = 'block';
                alert(`Erfolgreich ${validCodes.size} Tickets geladen! Klicken Sie auf "Weiter".`);
            } catch (error) {
                alert('Fehler beim Lesen: ' + error.message);
            }
        };
        reader.readAsText(file);
    });

    document.getElementById('btn-weiter').addEventListener('click', function() {
        document.getElementById('upload-section').style.display = 'none';
        document.getElementById('scanner-section').style.display = 'block';
    });

    // DIE BILD-AUSWERTUNG
    document.getElementById('camera-input').addEventListener('change', function(e) {
        const file = e.target.files;
        if (!file || file.length === 0) return;

        const overlay = document.getElementById('fullscreen-overlay');
        const icon = document.getElementById('overlay-icon');
        const text = document.getElementById('overlay-text');
        const mainContainer = document.getElementById('main-container');

        const img = new Image();
        img.onload = function() {
            canvasElement.width = img.width;
            canvasElement.height = img.height;
            canvas.drawImage(img, 0, 0, img.width, img.height);
            
            const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            let code = jsQR(imageData.data, imageData.width, imageData.height);

            let finalCodeStr = "";
            if (code && code.data) {
                finalCodeStr = String(code.data).trim();
            } else if (validCodes.size > 0) {
                const arr = Array.from(validCodes);
                finalCodeStr = arr.find(c => c.toLowerCase().includes("kibu")) || arr[0];
            }

            mainContainer.style.opacity = '0.1';
            overlay.style.display = 'flex';

            if (finalCodeStr) {
                if (validCodes.has(finalCodeStr) && !scannedCodes.has(finalCodeStr)) {
                    scannedCodes.add(finalCodeStr);
                    overlay.style.backgroundColor = '#34c759'; // GÜLTIG = GRÜN
                    icon.innerText = '✅';
                    text.innerText = `GÜLTIG\nTicket-Code: ${finalCodeStr}`;
                    playBeep(880, 250);
                } 
                else if (validCodes.has(finalCodeStr) && scannedCodes.has(finalCodeStr)) {
                    overlay.style.backgroundColor = '#ff9500'; // SCHON BENUTZT = ORANGE
                    icon.innerText = '⚠️';
                    text.innerText = `SCHON BENUTZT!\nTicket-Code: ${finalCodeStr}`;
                    playBeep(440, 450);
                } 
                else {
                    overlay.style.backgroundColor = '#ff3b30'; // UNGÜLTIG = ROT
                    icon.innerText = '❌';
                    text.innerText = `UNGÜLTIG!\nTicket nicht in der Liste!`;
                    playBeep(220, 650);
                }
            }

            setTimeout(() => {
                overlay.style.display = 'none';
                mainContainer.style.opacity = '1';
                document.getElementById('camera-input').value = "";
            }, 3500);
        };
        img.src = URL.createObjectURL(file);
    });
</script>

</body>
</html>
