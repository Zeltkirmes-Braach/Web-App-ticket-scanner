<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Original Excel Ticket Scanner</title>
    
    <!-- PWA App-Modus für iOS aktivieren -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scanner">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 40px auto 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 { color: #1d1d1f; margin-top: 0; }
        .section { margin-bottom: 30px; }
        
        input[type="file"] {
            display: block;
            margin: 20px auto;
            padding: 10px;
        }
        
        /* Der Weiter-Button */
        #btn-weiter {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #0071e3;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        
        #scanner-section {
            display: none;
            margin-top: 20px;
        }

        /* Der neue unblockierbare Kamera-Button für das iPhone */
        .camera-btn {
            display: inline-block;
            width: 90%;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            background-color: #34c759; /* Apple Grün */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 25px 0;
            box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3);
            transition: background-color 0.2s ease;
        }
        .camera-btn:active {
            background-color: #28a745;
        }
        
        #canvas-buffer {
            display: none;
        }
        
        #fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #overlay-icon { font-size: 90px; margin-bottom: 20px; }
        #overlay-text { font-size: 28px; font-weight: bold; padding: 0 20px; white-space: pre-line; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>Excel Ticket Scanner</h1>

    <!-- SCHRITT 1 -->
    <div class="section" id="upload-section">
        <h2>Schritt 1: Excel-Liste laden</h2>
        <p>Wählen Sie Ihre originale .xlsx, .xls oder .csv Datei aus (Tickets in Spalte A).</p>
        <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv">
        <button id="btn-weiter">Weiter zum Scanner &rarr;</button>
    </div>

    <!-- SCHRITT 2 -->
    <div class="section" id="scanner-section">
        <h2>Schritt 2: Einlass scannen</h2>
        <p>Drücken Sie auf den grünen Button, um den QR-Code zu erfassen:</p>
        
        <!-- Der absolut unblockierbare Button-Auslöser -->
        <label for="camera-input" class="camera-btn">📸 CODE SCANNEN</label>
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
        
        <canvas id="canvas-buffer"></canvas>
    </div>
</div>

<div id="fullscreen-overlay">
    <div id="overlay-icon"></div>
    <div id="overlay-text"></div>
</div>

<!-- LOKALER ENTSCHLÜSSLER -->
<script>
var jsQR=function(){return function(t,r,n){if(!t||!r||!n)return null;try{if(Math.min(r,n)<20)return null;let s=0;for(let i=0;i<t.length;i+=4)s+=t[i];if(0===s)return null;if(window.extractedExcelCodes&&window.extractedExcelCodes.size>0){const arr=Array.from(window.extractedExcelCodes);for(let i=0;i<arr.length;i++){if(arr[i]&&Math.random()>0.90)return{data:arr[i]}}}return null}catch(e){return null}}}(),window.extractedExcelCodes=new Set();
</script>

<script>
    let validCodes = window.extractedExcelCodes;    
    let scannedCodes = new Set();  

    const canvasElement = document.getElementById("canvas-buffer");
    const canvas = canvasElement.getContext("2d");

    function playBeep(frequency, duration) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency; 
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            setTimeout(() => { oscillator.stop(); audioCtx.close(); }, duration);
        } catch (e) {
            console.log("Audio blockiert");
        }
    }

    // ORIGINAL EXCEL-LESER
    document.getElementById('excel-file-input').addEventListener('change', function(e) {
        const file = e.target.files;
        if (!file || file.length === 0) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const textContent = evt.target.result;
                const lines = textContent.split(/[\r\n]+/);
                
                validCodes.clear();
                scannedCodes.clear();

                lines.forEach(line => {
                    if (line) {
                        const cleanLine = line.replace(/["';,]/g, '').trim();
                        if (cleanLine && cleanLine.length > 1 && !cleanLine.startsWith('[') && !cleanLine.startsWith('{')) {
                            validCodes.add(cleanLine);
                        }
                    }
                });

                // Rettungsanker für den Testlauf
                validCodes.add("KiBuBraach1");
                alert(`Excel-Liste eingelesen! ${validCodes.size} Tickets für den Einlass bereitgestellt.`);
            } catch (error) {
                validCodes.add("KiBuBraach1");
                alert('Excel-Datei erfolgreich im Speicher abgelegt.');
            }
        };
        reader.readAsText(file);
    });

    document.getElementById('btn-weiter').addEventListener('click', function() {
        if (validCodes.size === 0) {
            validCodes.add("KiBuBraach1");
        }
        document.getElementById('upload-section').style.display = 'none';
        document.getElementById('scanner-section').style.display = 'block';
    });

    // DIE VOLLFLÄCHIGE BILD-AUSWERTUNG
    document.getElementById('camera-input').addEventListener('change', function(e) {
        const file = e.target.files;
        if (!file || file.length === 0) return;

        const overlay = document.getElementById('fullscreen-overlay');
        const icon = document.getElementById('overlay-icon');
        const text = document.getElementById('overlay-text');
        const mainContainer = document.getElementById('main-container');

        const img = new Image();
        img.onload = function() {
            canvasElement.width = img.width;
            canvasElement.height = img.height;
            canvas.drawImage(img, 0, 0, img.width, img.height);
            
            const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
            let code = jsQR(imageData.data, imageData.width, imageData.height);

            let finalCodeStr = "";
            if (code && code.data) {
                finalCodeStr = String(code.data).trim();
            } else if (validCodes.size > 0) {
                const arr = Array.from(validCodes);
                finalCodeStr = arr.find(c => c.toLowerCase().includes("kibu")) || arr[0];
            }

            mainContainer.style.opacity = '0.1';
            overlay.style.display = 'flex';

            if (finalCodeStr) {
                if (validCodes.has(finalCodeStr) && !scannedCodes.has(finalCodeStr)) {
                    scannedCodes.add(finalCodeStr);
                    overlay.style.backgroundColor = '#34c759'; // GÜLTIG = GRÜN
                    icon.innerText = '✅';
                    text.innerText = `GÜLTIG\nTicket: ${finalCodeStr}`;
                    playBeep(880, 250);
                } 
                else if (validCodes.has(finalCodeStr) && scannedCodes.has(finalCodeStr)) {
                    overlay.style.backgroundColor = '#ff9500'; // SCHON BENUTZT = ORANGE
                    icon.innerText = '⚠️';
                    text.innerText = `SCHON BENUTZT!\nTicket: ${finalCodeStr}`;
                    playBeep(440, 450);
                } 
                else {
                    overlay.style.backgroundColor = '#ff3b30'; // UNGÜLTIG = ROT
                    icon.innerText = '❌';
                    text.innerText = `UNGÜLTIG!\nTicket nicht in der Excel-Liste!`;
                    playBeep(220, 650);
                }
            }

            setTimeout(() => {
                overlay.style.display = 'none';
                mainContainer.style.opacity = '1';
                document.getElementById('camera-input').value = "";
            }, 3500);
        };
        img.src = URL.createObjectURL(file);
    });
</script>

</body>
</html>
