<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ticket Scanner App</title>
    
    <!-- PWA App-Modus für iOS aktivieren -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scanner">

    <!-- Excel- und QR-Bibliotheken stabil über HTTPS eingebunden -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 40px auto 0 auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 { color: #1d1d1f; margin-top: 0; }
        .section { margin-bottom: 30px; }
        
        input[type="file"] {
            display: block;
            margin: 20px auto;
            padding: 10px;
        }
        
        #btn-weiter {
            display: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #0071e3;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        
        #scanner-section {
            display: none;
            margin-top: 20px;
        }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        
        #fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #overlay-icon { font-size: 90px; margin-bottom: 20px; }
        #overlay-text { font-size: 32px; font-weight: bold; padding: 0 20px; white-space: pre-line; }
    </style>
</head>
<body>

<div class="container" id="main-container">
    <h1>Ticket Scanner App</h1>

    <!-- SCHRITT 1 -->
    <div class="section" id="upload-section">
        <h2>Schritt 1: Excel-Liste laden</h2>
        <p>Wählen Sie eine .xlsx oder .csv Datei aus (Codes in Spalte A).</p>
        <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv">
        <button id="btn-weiter">Weiter zum Scanner &rarr;</button>
    </div>

    <!-- SCHRITT 2 -->
    <div class="section" id="scanner-section">
        <h2>Schritt 2: Einlass scannen</h2>
        <div id="reader"></div>
    </div>
</div>

<div id="fullscreen-overlay">
    <div id="overlay-icon"></div>
    <div id="overlay-text"></div>
</div>

<script>
    let validCodes = new Set();    
    let scannedCodes = new Set();  
    let html5QrCode = null;

    function playBeep(frequency, duration) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioContext();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency; 
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            setTimeout(() => { oscillator.stop(); audioCtx.close(); }, duration);
        } catch (e) {
            console.log("Audio blockiert");
        }
    }

    document.getElementById('excel-file-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                let rows = [];
                
                if (file.name.endsWith('.csv')) {
                    const text = evt.target.result;
                    const lines = text.split(/\r?\n/);
                    lines.forEach(l => { if(l) rows.push([l.replace(/["';]/g, '').trim()]); });
                } else {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                }

                validCodes.clear();
                scannedCodes.clear();

                rows.forEach(row => {
                    if (row && row[0]) {
                        const code = String(row[0]).trim();
                        if (code) validCodes.add(code);
                    }
                });

                if (validCodes.size > 0) {
                    document.getElementById('btn-weiter').style.display = 'block';
                    alert(`Erfolgreich ${validCodes.size} Tickets geladen!`);
                } else {
                    alert('Keine Tickets in der ersten Spalte gefunden.');
                }
            } catch (error) {
                alert('Fehler beim Verarbeiten der Datei: ' + error.message);
            }
        };
        
        if (file.name.endsWith('.csv')) {
            reader.readAsText(file);
        } else {
            reader.readAsArrayBuffer(file);
        }
    });

    document.getElementById('btn-weiter').addEventListener('click', function() {
        document.getElementById('upload-section').style.display = 'none';
        document.getElementById('scanner-section').style.display = 'block';
        
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 15, qrbox: { width: 250, height: 250 } },
            onScanSuccess,
            onScanFailure
        ).catch(err => {
            alert("Kamera-Fehler. Bitte App auf dem Home-Bildschirm erlauben.");
        });
    });

    function onScanSuccess(decodedText) {
        const cleanCode = String(decodedText).trim();
        const overlay = document.getElementById('fullscreen-overlay');
        const icon = document.getElementById('overlay-icon');
        const text = document.getElementById('overlay-text');

        overlay.style.display = 'flex';

        if (validCodes.has(cleanCode) && !scannedCodes.has(cleanCode)) {
            scannedCodes.add(cleanCode);
            overlay.style.backgroundColor = '#34c759'; // GRÜN
            icon.innerText = '✅';
            text.innerText = `GÜLTIG\nTicket: ${cleanCode}`;
            playBeep(880, 250);
        } 
        else if (validCodes.has(cleanCode) && scannedCodes.has(cleanCode)) {
            overlay.style.backgroundColor = '#ff9500'; // ORANGE
            icon.innerText = '⚠️';
            text.innerText = `BEREITS SCANNT!\nTicket: ${cleanCode}`;
            playBeep(440, 450);
        } 
        else {
            overlay.style.backgroundColor = '#ff3b30'; // ROT
            icon.innerText = '❌';
            text.innerText = `UNGÜLTIG!\nKein Ticket gefunden`;
            playBeep(220, 650);
        }

        setTimeout(() => {
            overlay.style.display = 'none';
        }, 3000);
    }

    function onScanFailure(error) {}
</script>

</body>
</html>
